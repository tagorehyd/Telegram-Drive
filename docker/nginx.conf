server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    server_tokens off;

    # Container orchestration probes this endpoint without loading the SPA.
    location = /healthz {
        access_log off;
        add_header Cache-Control "no-store" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Vite fingerprints production assets.  Cache those indefinitely while
    # allowing index.html to pick up each newly deployed release.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # Keep client-side routing working when the Web UI is opened directly on a
    # nested route.  No API, proxy, or server-side file endpoint is exposed.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
